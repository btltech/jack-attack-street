name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Jack Attack
        run: npm run build

      - name: Copy Ayò game to dist
        run: cp -r ayo dist/

      - name: Generate Open Graph PNG images
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin fonts-dejavu-core
          rsvg-convert -w 1200 -h 630 scripts/og/og-home.svg -o dist/og-home.png
          rsvg-convert -w 1200 -h 630 scripts/og/og-jackattack.svg -o dist/og-jackattack.png
          rsvg-convert -w 1200 -h 630 scripts/og/og-ayo.svg -o dist/og-ayo.png

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
