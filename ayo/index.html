    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              display: ['"Outfit"', '"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            },

    <style>
      body {
        background-color: #022c22;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      }
      .tabular-nums { font-variant-numeric: tabular-nums; }
      :focus-visible {
        outline: 3px solid #fbbf24;
        outline-offset: 2px;
      }
      @keyframes ayoSeedDrop {
        0% {
          transform: translate(-50%, -34px) scale(1.25);
          opacity: 1;
        }
        72% {
          transform: translate(-50%, 6px) scale(1);
          opacity: 1;
        }
        100% {
          transform: translate(-50%, 10px) scale(0.85);
          opacity: 0;
        }
      }
      .animate-seed-drop {
        animation: ayoSeedDrop 290ms cubic-bezier(0.35, 0.02, 0.65, 1) forwards;
      }
      /* Board feedback: ring where a seed lands / is lifted / is captured, squash on impact, pop on change. */
      @keyframes ayoRipple { 0% { transform: scale(0.55); opacity: 0.8; } 100% { transform: scale(1.35); opacity: 0; } }
      .ayo-ripple { border: 3px solid rgba(253, 224, 71, 0.9); animation: ayoRipple 480ms ease-out forwards; }
      @keyframes ayoPull { 0% { transform: scale(1.45); opacity: 0; } 40% { opacity: 0.85; } 100% { transform: scale(0.7); opacity: 0; } }
      .ayo-pull { border: 3px solid rgba(251, 191, 36, 0.9); animation: ayoPull 420ms ease-in forwards; }
      @keyframes ayoBurst { 0% { transform: scale(0.6); opacity: 0.95; } 100% { transform: scale(1.7); opacity: 0; } }
      .ayo-burst { border: 4px solid rgba(52, 211, 153, 0.95); box-shadow: 0 0 22px rgba(52, 211, 153, 0.8); animation: ayoBurst 620ms ease-out forwards; }
      @keyframes ayoThump { 0% { transform: scale(1); } 30% { transform: scale(0.86); } 65% { transform: scale(1.07); } 100% { transform: scale(1); } }
      .ayo-thump { animation: ayoThump 240ms ease-out; }
      @keyframes ayoPop { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
      .ayo-pop { animation: ayoPop 320ms cubic-bezier(0.3, 1.6, 0.5, 1); }
      @keyframes ayoConfetti {
        0% { transform: translateY(-12vh) rotate(0deg); opacity: 0; }
        10% { opacity: 1; }
        100% { transform: translateY(105vh) rotate(540deg); opacity: 1; }
      }
      .ayo-confetti { position: absolute; top: 0; width: 12px; height: 12px; border-radius: 9999px; animation: ayoConfetti 3s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        .ayo-ripple, .ayo-pull, .ayo-burst, .ayo-thump, .ayo-pop { animation: none !important; }
        .ayo-confetti { display: none; }
      }
    </style>

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
