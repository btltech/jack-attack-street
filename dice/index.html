<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#4c0519" />

    <link rel="canonical" href="https://www.jackattackstreets.com/dice/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Classic Street Games" />
    <meta property="og:title" content="Street Dice — Push Your Luck. Bank Before It Busts." />
    <meta property="og:description" content="A free daily dice game: five rounds, one minute, the same rolls for everyone. How far will you push it?" />
    <meta property="og:url" content="https://www.jackattackstreets.com/dice/" />
    <meta property="og:image" content="https://www.jackattackstreets.com/og-dice.png" />
    <meta property="og:image:width" content="1200" />

    <meta property="og:image:alt" content="Street Dice: two dice and the line Push your luck, bank before it busts" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Street Dice — Free Daily Dice Game" />
    <meta name="twitter:description" content="Five rounds, one minute, the same rolls for everyone. Bank before a 1 busts you." />
    <meta name="twitter:image" content="https://www.jackattackstreets.com/og-dice.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Street Dice" />

    <link rel="manifest" href="/dice/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/dice/favicon-32.png" />
    <link rel="apple-touch-icon" href="/dice/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              display: ['"Outfit"', '"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Street Dice",
        "description": "A free daily push-your-luck dice game. Five rounds, the same rolls for everyone.",
        "url": "https://www.jackattackstreets.com/dice/",
        "applicationCategory": "Game",
        "operatingSystem": "Any (web browser)",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "GBP" }
      }
    </script>
    <style>
      body {
        background-color: #1c0509;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      }
      .tabular-nums { font-variant-numeric: tabular-nums; }
      :focus-visible { outline: 3px solid #fbbf24; outline-offset: 2px; }
      @keyframes diceTumble {
        0% { transform: translateY(-34px) rotate(0deg) scale(1.08); }
        35% { transform: translateY(6px) rotate(150deg) scale(0.96); }
        60% { transform: translateY(-14px) rotate(260deg) scale(1.03); }
        100% { transform: translateY(0) rotate(360deg) scale(1); }
      }
      .dice-tumble { animation: diceTumble 0.68s cubic-bezier(0.3, 0.1, 0.4, 1) both; }
      @keyframes diceShake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-9px); }
        40% { transform: translateX(8px); }
        60% { transform: translateX(-6px); }
        80% { transform: translateX(4px); }
      }
      .dice-shake { animation: diceShake 0.45s ease-in-out; }
      @media (prefers-reduced-motion: reduce) {
        .dice-tumble, .dice-shake { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/dice/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
